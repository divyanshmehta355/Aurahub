version: "3.8"

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: aurahub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aurahub
      POSTGRES_PASSWORD: aurahub_secret
      POSTGRES_DB: aurahub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurahub -d aurahub"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 2. Valkey (Redis-compatible High-performance Cache)
  valkey:
    image: valkey/valkey:8-alpine
    container_name: aurahub-valkey
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 3. Apache Kafka (KRaft mode - Zero Zookeeper)
  kafka:
    image: apache/kafka:3.8.0
    container_name: aurahub-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # One-shot topic initializer for Kafka
  kafka-init:
    image: apache/kafka:3.8.0
    container_name: aurahub-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "-c" ]
    command: >
      "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic aurahub.video.lifecycle --partitions 3 --replication-factor 1 &&
       /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic aurahub.video.upload --partitions 3 --replication-factor 1 &&
       echo '[Kafka Init] Topics verified successfully.'"

  # 4. OpenSearch (Full-Text Search & Real-Time Suggestions)
  opensearch:
    image: opensearchproject/opensearch:2.18.0
    container_name: aurahub-opensearch
    restart: unless-stopped
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      bootstrap.memory_lock: "true"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://localhost:9200/_cluster/health > /dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s

  # 5. Aurahub Backend API (Go Fiber)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aurahub-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      kafka:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://aurahub:aurahub_secret@postgres:5432/aurahub?sslmode=disable
      VALKEY_URL: redis://valkey:6379
      KAFKA_BROKERS: kafka:9092
      KAFKA_AUTH_METHOD: plain
      OPENSEARCH_URL: http://opensearch:9200
      JWT_SECRET: super_secret_aurahub_local_demo_jwt_key_123456789
      FRONTEND_ORIGINS: http://localhost:5173,http://localhost:3000,http://frontend:5173
      PORT: 8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # 6. Aurahub Frontend (SvelteKit)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aurahub-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_BACKEND_URL: http://backend:8080

volumes:
  postgres_data:
  valkey_data:
  kafka_data:
  opensearch_data:
